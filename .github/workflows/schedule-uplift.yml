# This workflow automates creation of uplift pull requests for tt_forge_models.
# Uplift PR is created weekly to uplift the submodule to the latest version.

name: Weekly Forge Models Uplift

on:
  schedule:
    - cron: '0 8 * * 6'
  workflow_dispatch:

permissions: {} # the job lists what it needs

jobs:
  uplift-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # built-in token: comment with the commit list
      id-token: write # OSPO Vault sign-in only (scheduled runs on main)

    env:
      TT_FORGE_MODELS_SUBMODULE_PATH: third_party/tt_forge_models

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive
          fetch-depth: 0
          ref: main
          persist-credentials: false

      - name: Fetch commit history and set env variables
        id: set-env-variables
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "TODAY=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
          echo "CURRENT_COMMIT_SHA=$(cd ${{ env.TT_FORGE_MODELS_SUBMODULE_PATH }} && git rev-parse HEAD)" >> $GITHUB_OUTPUT
          LATEST_TT_FORGE_MODELS_VERSION=$(gh api repos/tenstorrent/tt-forge-models/commits/main --jq '.sha')
          echo "LATEST_TT_FORGE_MODELS_VERSION=$LATEST_TT_FORGE_MODELS_VERSION" >> $GITHUB_OUTPUT

      - name: Update tt-forge-models submodule to latest
        run: |
          echo "Updating tt-forge-models to SHA: ${{ steps.set-env-variables.outputs.LATEST_TT_FORGE_MODELS_VERSION }}"
          git submodule update --remote --merge ${{ env.TT_FORGE_MODELS_SUBMODULE_PATH }}
          git add ${{ env.TT_FORGE_MODELS_SUBMODULE_PATH }}

      - name: Fetch commit history from tt-forge-models repository
        run: |
          # Clone the tt-forge-models repository
          cd ${{ runner.temp }}
          echo "### List of tt-forge-models commits since previous uplift:" > commit_list.txt
          git clone https://github.com/tenstorrent/tt-forge-models.git tt-forge-models
          cd tt-forge-models
          # Fetch commit history between $COMMIT_SHA and LATEST_SHA
          echo '```' >> ${{ runner.temp }}/commit_list.txt
          git log --format='%cd (%h) by %cn (Author %ae) : %s' --date=short ${{ steps.set-env-variables.outputs.CURRENT_COMMIT_SHA}}..${{ steps.set-env-variables.outputs.LATEST_TT_FORGE_MODELS_VERSION }} >> ${{ runner.temp }}/commit_list.txt
          echo '```' >> ${{ runner.temp }}/commit_list.txt
          cd ${{ runner.temp }}
          cat commit_list.txt

      # ITSEC-295: the uplift PR is pushed and opened with a short-lived token
      # from OSPO Vault (contents and pull requests on tt-forge only). It is given
      # only to the weekly scheduled run on main. This job does not approve or
      # merge. A person reviews and merges the PR.
      - name: Manual run opens no PR
        if: ${{ github.event_name != 'schedule' || github.ref != 'refs/heads/main' }}
        run: |
          echo "::notice::Manual run: the steps above show what the next uplift contains. Only the weekly scheduled run on main opens the PR (ITSEC-295)."

      - name: Get a token to open the PR
        if: ${{ github.event_name == 'schedule' && github.ref == 'refs/heads/main' }}
        id: vault
        uses: tenstorrent/.github/actions/vault-secrets@a697f1bb22ad8b488b0ac63f9a261e462179fe13 # vault-secrets-v1.0.0
        with:
          role: tenstorrent--tt-forge--main
          github-token: tenstorrent--tt-forge--uplift-pr

      - name: Create Pull Request
        if: ${{ github.event_name == 'schedule' && github.ref == 'refs/heads/main' }}
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        id: create-pr
        with:
          branch: uplift-forge-models
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          base: main
          commit-message: "Uplift ${{ env.TT_FORGE_MODELS_SUBMODULE_PATH }} to ${{ steps.set-env-variables.outputs.LATEST_TT_FORGE_MODELS_VERSION }} ${{ env.TODAY }}"
          title: "Uplift ${{ env.TT_FORGE_MODELS_SUBMODULE_PATH }} to ${{ steps.set-env-variables.outputs.LATEST_TT_FORGE_MODELS_VERSION }} ${{ env.TODAY }}"
          body: "This PR uplifts the ${{ env.TT_FORGE_MODELS_SUBMODULE_PATH }} to the ${{ steps.set-env-variables.outputs.LATEST_TT_FORGE_MODELS_VERSION }}"
          labels: uplift
          delete-branch: true
          token: ${{ steps.vault.outputs.token }}

      # Last use of the token is above. Leaving the tailnet cuts this job off from Vault.
      - name: Leave tailnet
        if: ${{ always() && github.event_name == 'schedule' && github.ref == 'refs/heads/main' }}
        run: sudo tailscale logout || { echo "::warning::tailscale logout failed; taking the interface down"; sudo tailscale down || true; }

      # No approve step and no auto-merge (ITSEC-295). A person reviews and merges the uplift PR.
      - name: Add Comment with Commit List
        if: ${{ steps.create-pr.outputs.pull-request-number }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ steps.create-pr.outputs.pull-request-number }} --body "$(cat ${{ runner.temp }}/commit_list.txt)"
          rm -rf ${{ runner.temp }}/tt-forge-models
          rm -f ${{ runner.temp }}/commit_list.txt
